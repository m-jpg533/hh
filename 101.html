<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>TikTok 手機版播放器</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

/* ===== 滑動容器 ===== */

.container{
    width:100vw;
    height:100dvh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
}

/* ===== 每頁影片 ===== */

.page{
    width:100vw;
    height:100dvh;
    position:relative;
    scroll-snap-align:start;
}

/* ===== 影片 ===== */

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===== 點擊遮罩 ===== */

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:20px;

    background:rgba(0,0,0,0.25);

    z-index:5;
}

/* ===== 底部廣告 ===== */

#ad{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:70px;
    background:black;
    z-index:9999;
}

#ad video{
    width:100%;
    height:100%;
    object-fit:contain;
}

#close{
    position:absolute;
    right:10px;
    top:5px;
    width:30px;
    height:30px;
    background:red;
    color:white;
    border:none;
    z-index:10000;
}

</style>
</head>

<body>

<!-- ===== 主容器 ===== -->
<div class="container">

    <!-- 影片1 -->
    <div class="page">
        <video class="vid" muted playsinline>
            <source src="https://m-jpg533.github.io/hh/100.mp4">
        </video>
        <div class="overlay">點一下開聲音</div>
    </div>

    <!-- 影片2 -->
    <div class="page">
        <video class="vid" muted playsinline>
            <source src="https://m-jpg533.github.io/hh/101.mp4">
        </video>
        <div class="overlay">點一下開聲音</div>
    </div>

    <!-- 影片3（已修正） -->
    <div class="page">
        <video class="vid" muted playsinline>
            <source src="https://m-jpg533.github.io/hh/107.mp4">
        </video>
        <div class="overlay">點一下開聲音</div>
    </div>

 <!-- 影片4（已修正） -->
    <div class="page">
        <video class="vid" muted playsinline>
            <source src="https://m-jpg533.github.io/hh/106.mp4">
        </video>
        <div class="overlay">點一下開聲音</div>
    </div>

</div>

<!-- ===== 底部廣告 ===== -->
<div id="ad">

    <button id="close">×</button>

    <video autoplay muted loop playsinline>
        <source src="https://m-jpg533.github.io/hh/101.mp4">
    </video>

</div>

<script>

const videos = document.querySelectorAll(".vid");
const overlays = document.querySelectorAll(".overlay");

let soundEnabled = false;

/* ===== 點擊開聲音 ===== */

overlays.forEach((overlay, index) => {

    overlay.addEventListener("click", () => {

        soundEnabled = true;

        overlay.style.display = "none";

        videos.forEach(v => v.muted = true);

        videos[index].muted = false;
        videos[index].play();

    });

});

/* ===== 滑動播放 ===== */

const observer = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{

        const video = entry.target;

        if(entry.isIntersecting){

            video.play();

            if(soundEnabled){

                videos.forEach(v=>{
                    if(v!==video) v.muted = true;
                });

                video.muted = false;
            }

        }else{

            video.pause();
            video.muted = true;

        }

    });

},{threshold:0.7});

/* ===== 套用 ===== */

videos.forEach(v=>{
    observer.observe(v);
});

/* ===== 第一支影片自動播放 ===== */

videos[0].play();

/* ===== 關閉廣告 ===== */

document.getElementById("close").onclick = ()=>{

    document.getElementById("ad").style.display="none";

};

</script>

</body>
</html>
