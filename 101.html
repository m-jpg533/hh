<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikTok 播放器</title>

<style>

body{
    margin:0;
    background:black;
    overflow:hidden;
    height:100vh;
}

/* ===== 滑動容器 ===== */
.container{
    width:100vw;
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
}

/* 每頁影片 */
.page{
    width:100vw;
    height:100vh;
    position:relative;
    scroll-snap-align:start;
}

/* 主影片 */
video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* 點擊開聲 */
.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:22px;
    background:rgba(0,0,0,0.25);
    cursor:pointer;
    z-index:5;
}

/* ===== 底部廣告 ===== */
#ad{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:70px;
    background:black;
    z-index:9999;
}

#ad video{
    width:100%;
    height:100%;
    object-fit:contain;
}

#close{
    position:absolute;
    right:10px;
    top:5px;
    width:28px;
    height:28px;
    background:red;
    color:white;
    border:none;
    cursor:pointer;
    z-index:10000;
}

</style>
</head>

<body>

<!-- ===== 主容器 ===== -->
<div class="container">

    <!-- ===== 影片1 ===== -->
    <div class="page">

        <video class="vid" muted playsinline loop>
            <source src="https://m-jpg533.github.io/hh/100.mp4">
        </video>

        <div class="overlay">
            點一下開聲音
        </div>

    </div>

    <!-- ===== 影片2 ===== -->
    <div class="page">

        <video class="vid" muted playsinline loop>
            <source src="https://m-jpg533.github.io/hh/101.mp4">
        </video>

        <div class="overlay">
            點一下開聲音
        </div>

    </div>

</div>

<!-- ===== 底部廣告 ===== -->
<div id="ad">

    <button id="close">×</button>

    <video autoplay muted loop playsinline>
        <source src="https://m-jpg533.github.io/hh/101.mp4">
    </video>

</div>

<script>

const videos = document.querySelectorAll(".vid");
const overlays = document.querySelectorAll(".overlay");

let soundEnabled = false;

/* ===== 點一下開聲音 ===== */
overlays.forEach((overlay, index) => {

    overlay.addEventListener("click", () => {

        soundEnabled = true;

        overlay.style.display = "none";

        videos.forEach(v => {
            v.muted = true;
        });

        videos[index].muted = false;
        videos[index].play();

    });

});


/* ===== 自動播放切換 ===== */
const observer = new IntersectionObserver((entries) => {

    entries.forEach(entry => {

        const video = entry.target;

        if(entry.isIntersecting){

            // 播放目前影片
            video.play();

            // 如果已開聲音
            if(soundEnabled){

                // 其他全部靜音
                videos.forEach(v => {

                    if(v !== video){

                        v.muted = true;

                    }

                });

                // 目前影片開聲
                video.muted = false;

            }

        }else{

            // 離開畫面停止
            video.pause();

            // 靜音
            video.muted = true;

        }

    });

},{
    threshold:0.7
});


/* ===== 套用 observer ===== */
videos.forEach(video => {

    observer.observe(video);

});


/* ===== 第一支影片自動播放 ===== */
videos[0].play();


/* ===== 關閉廣告 ===== */
document.getElementById("close").onclick = () => {

    document.getElementById("ad").style.display = "none";

};

</script>

</body>
</html>
