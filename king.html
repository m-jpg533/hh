<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動態海報範本</title>
<style>
  :root{
    --ink:#12312c;
    --ink-deep:#0a201c;
    --paper:#f3ede0;
    --gold:#c8973f;
    --jade:#4c8a76;
    --jade-soft:#a9c9bd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink-deep);
  }

  body{
    font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
  }

  .stage{
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 640px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 20% 0%, #1c463f 0%, var(--ink) 45%, var(--ink-deep) 100%);
  }

  /* ---------- 潑墨漂浮色塊（放最底層，緩緩漂移＋呼吸縮放） ---------- */
  .ink-blob{
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: .35;
    mix-blend-mode: screen;
    will-change: transform;
  }
  .ink-blob.b1{
    width: 480px; height: 480px;
    top: -120px; left: -100px;
    background: radial-gradient(circle, var(--jade) 0%, transparent 70%);
    animation: drift1 22s ease-in-out infinite;
  }
  .ink-blob.b2{
    width: 380px; height: 380px;
    top: 30%; right: -140px;
    background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
    opacity: .22;
    animation: drift2 26s ease-in-out infinite;
  }
  .ink-blob.b3{
    width: 300px; height: 300px;
    bottom: -80px; left: 20%;
    background: radial-gradient(circle, var(--jade-soft) 0%, transparent 70%);
    opacity: .18;
    animation: drift3 30s ease-in-out infinite;
  }

  @keyframes drift1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(40px,30px) scale(1.15); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-30px,40px) scale(1.1); }
  }
  @keyframes drift3{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(20px,-25px) scale(1.08); }
  }

  /* ---------- 印章徽標（簽名元素） ---------- */
  .seal{
    position: absolute;
    top: 28px; right: 28px;
    width: 74px; height: 74px;
    border: 3px solid var(--gold);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    writing-mode: vertical-rl;
    background: rgba(200,151,63,0.08);
    animation: sealPulse 3.2s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes sealPulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(200,151,63,.35); }
    50%{ box-shadow: 0 0 0 8px rgba(200,151,63,0); }
  }

  /* ---------- 人物照片：這裡放您自己的 jpg ---------- */
  .portrait-wrap{
    position: absolute;
    right: 4%;
    bottom: 0;
    height: 88%;
    max-height: 780px;
    z-index: 3;
    -webkit-mask-image: linear-gradient(to top, black 78%, transparent 100%);
            mask-image: linear-gradient(to top, black 78%, transparent 100%);
  }
  .portrait-wrap img{
    height: 100%;
    width: auto;
    display: block;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,.45));
    animation: floatSlow 6s ease-in-out infinite;
  }
  @keyframes floatSlow{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-10px); }
  }

  /* ---------- 標題文字區：換成您自己的文字 ---------- */
  .headline{
    position: absolute;
    left: 6%;
    top: 12%;
    z-index: 4;
    color: var(--paper);
    opacity: 0;
    animation: fadeUp 1.1s ease-out .3s forwards;
  }
  .headline .name{
    font-size: clamp(40px, 7vw, 76px);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 4px;
    writing-mode: vertical-rl;
    border-left: 4px solid var(--gold);
    padding-left: 14px;
  }
  .headline .role{
    margin-top: 14px;
    font-size: 15px;
    color: var(--jade-soft);
    letter-spacing: 2px;
  }

  .tagline{
    position: absolute;
    left: 6%;
    bottom: 9%;
    z-index: 4;
    color: var(--paper);
    max-width: 60%;
    opacity: 0;
    animation: fadeUp 1.1s ease-out .8s forwards;
  }
  .tagline .big{
    font-size: clamp(20px, 3vw, 30px);
    font-weight: 700;
    line-height: 1.6;
  }
  .tagline .small{
    margin-top: 10px;
    font-size: 14px;
    color: var(--jade-soft);
    letter-spacing: 1px;
  }

  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(18px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- 底部城市剪影 ---------- */
  .skyline{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 22%;
    z-index: 2;
    overflow: hidden;
  }
  .skyline svg{
    position: absolute;
    bottom: 0; left: 0;
    width: 140%;
    height: 100%;
    animation: cityDrift 40s linear infinite;
  }
  @keyframes cityDrift{
    from{ transform: translateX(0); }
    to{ transform: translateX(-30%); }
  }

  /* ---------- 移動的車子 ---------- */
  .car{
    position: absolute;
    bottom: 6%;
    left: -60px;
    z-index: 3;
    animation: carRun 9s linear infinite;
  }
  @keyframes carRun{
    from{ left: -60px; }
    to{ left: 105%; }
  }

  /* ---------- 移動的捷運（在較高的軌道上跑） ---------- */
  .mrt{
    position: absolute;
    bottom: 15%;
    right: -220px;
    z-index: 3;
    animation: mrtRun 13s linear infinite;
  }
  @keyframes mrtRun{
    from{ right: -220px; }
    to{ right: 105%; }
  }

  @media (prefers-reduced-motion: reduce){
    .ink-blob, .portrait-wrap img, .skyline svg, .car, .mrt, .seal{
      animation: none !important;
    }
  }

  @media (max-width: 720px){
    .headline{ top: 8%; }
    .tagline{ max-width: 80%; bottom: 20%; }
    .portrait-wrap{ right: 0; height: 70%; }
  }  /* ---------- 背景音樂控制按鈕 ---------- */
  .sound-btn{
    position: absolute;
    top: 28px;
    right: 118px;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 6;
    transition: background .2s;
  }
  .sound-btn:hover{
    background: rgba(0,0,0,.5);
  }
  .sound-btn svg{
    width: 22px; height: 22px;
    fill: var(--paper);
  }

  @media (max-width: 720px){
    .sound-btn{ right: auto; left: 20px; top: 20px; }
  }

</style>
</head>
<body>

<div class="stage">

  <!-- 潑墨背景 -->
  <div class="ink-blob b1"></div>
  <div class="ink-blob b2"></div>
  <div class="ink-blob b3"></div>

  <!-- 背景音樂控制按鈕（點一下切換靜音/播放） -->
  <button class="sound-btn" id="soundBtn" aria-label="切換背景音樂">
    <svg id="iconOn" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    <svg id="iconOff" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.51l2.45 2.45c.03-.31.05-.62.05-.93zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4l-1.88 1.88L12 7.76V4z"/></svg>
  </button>

  <!-- 背景音樂：把 src 換成您自己的 mp3 檔案路徑 -->
  <audio id="bgm" loop preload="auto">
    <source src="https://m-jpg533.github.io/pp/59.mp3" type="audio/mpeg">
  </audio>

  <!-- 印章徽標：文字換成自己的名字或標語縮寫 -->
  <div class="seal">信</div>

  <!-- 標題文字：換成您自己的文字 -->
  <div class="headline">
    <div class="name">王子貴</div>
    <div class="role">正直清廉</div>
  </div>

  <!-- 底部標語：換成您自己的文字 -->
  <div class="tagline">
    <div class="big">桃園市長候選人。</div>
    <div class="small">只要到我家一律請客。</div>
  </div>

  <!-- 人物照片：把 src 換成您自己的 jpg 路徑（建議去背 PNG 效果更好） -->
  <div class="portrait-wrap">
    <img src="https://m-jpg533.github.io/hh/133.png" alt="人物照片">
  </div>

  <!-- 城市剪影 -->
  <div class="skyline">
    <svg viewBox="0 0 1600 220" preserveAspectRatio="none">
      <rect x="0" y="140" width="60" height="80" fill="#0a201c"/>
      <rect x="70" y="100" width="40" height="120" fill="#0e2a25"/>
      <rect x="120" y="160" width="50" height="60" fill="#0a201c"/>
      <rect x="180" y="80" width="35" height="140" fill="#0e2a25"/>
      <rect x="225" y="130" width="55" height="90" fill="#0a201c"/>
      <rect x="290" y="60" width="45" height="160" fill="#123a33"/>
      <rect x="345" y="150" width="40" height="70" fill="#0a201c"/>
      <rect x="400" y="110" width="60" height="110" fill="#0e2a25"/>
      <rect x="470" y="170" width="50" height="50" fill="#0a201c"/>
      <rect x="530" y="90" width="35" height="130" fill="#0e2a25"/>
      <rect x="580" y="140" width="60" height="80" fill="#0a201c"/>
      <rect x="650" y="70" width="45" height="150" fill="#123a33"/>
      <rect x="705" y="150" width="40" height="70" fill="#0a201c"/>
      <rect x="760" y="100" width="55" height="120" fill="#0e2a25"/>
      <rect x="820" y="165" width="50" height="55" fill="#0a201c"/>
      <rect x="880" y="85" width="35" height="135" fill="#0e2a25"/>
      <rect x="925" y="140" width="60" height="80" fill="#0a201c"/>
      <rect x="995" y="65" width="45" height="155" fill="#123a33"/>
      <rect x="1050" y="150" width="40" height="70" fill="#0a201c"/>
      <rect x="1100" y="110" width="60" height="110" fill="#0e2a25"/>
      <rect x="1170" y="170" width="50" height="50" fill="#0a201c"/>
      <rect x="1230" y="90" width="35" height="130" fill="#0e2a25"/>
      <rect x="1280" y="140" width="60" height="80" fill="#0a201c"/>
      <rect x="1350" y="70" width="45" height="150" fill="#123a33"/>
      <rect x="1405" y="150" width="40" height="70" fill="#0a201c"/>
      <rect x="1460" y="100" width="55" height="120" fill="#0e2a25"/>
      <rect x="1520" y="165" width="50" height="55" fill="#0a201c"/>
    </svg>
  </div>

  <!-- 移動的車子（簡單向量圖形，可自行換成您的車輛圖片） -->
  <svg class="car" width="90" height="34" viewBox="0 0 90 34">
    <rect x="4" y="14" width="82" height="14" rx="5" fill="#c8973f"/>
    <path d="M18 14 L28 4 H62 L72 14 Z" fill="#c8973f"/>
    <rect x="30" y="6" width="30" height="9" fill="#0a201c" opacity=".55"/>
    <circle cx="22" cy="29" r="6" fill="#0a201c"/>
    <circle cx="68" cy="29" r="6" fill="#0a201c"/>
  </svg>

  <!-- 移動的捷運車廂 -->
  <svg class="mrt" width="220" height="42" viewBox="0 0 220 42">
    <rect x="0" y="4" width="220" height="30" rx="6" fill="#4c8a76"/>
    <rect x="8" y="10" width="26" height="14" rx="2" fill="#f3ede0" opacity=".85"/>
    <rect x="42" y="10" width="26" height="14" rx="2" fill="#f3ede0" opacity=".85"/>
    <rect x="76" y="10" width="26" height="14" rx="2" fill="#f3ede0" opacity=".85"/>
    <rect x="110" y="10" width="26" height="14" rx="2" fill="#f3ede0" opacity=".85"/>
    <rect x="144" y="10" width="26" height="14" rx="2" fill="#f3ede0" opacity=".85"/>
    <rect x="178" y="10" width="26" height="14" rx="2" fill="#f3ede0" opacity=".85"/>
    <circle cx="18" cy="38" r="4" fill="#0a201c"/>
    <circle cx="60" cy="38" r="4" fill="#0a201c"/>
    <circle cx="150" cy="38" r="4" fill="#0a201c"/>
    <circle cx="200" cy="38" r="4" fill="#0a201c"/>
  </svg>

</div>

<script>
  const bgm = document.getElementById('bgm');
  const soundBtn = document.getElementById('soundBtn');
  const iconOn = document.getElementById('iconOn');
  const iconOff = document.getElementById('iconOff');
  let started = false;

  function showPlaying(isPlaying){
    iconOn.style.display = isPlaying ? 'block' : 'none';
    iconOff.style.display = isPlaying ? 'none' : 'block';
  }

  // 大部分瀏覽器不允許網頁一開啟就自動有聲音播放，
  // 所以先嘗試自動播放；如果被瀏覽器擋下來，
  // 就等使用者點一下按鈕再開始播放。
  bgm.play().then(() => {
    started = true;
    showPlaying(true);
  }).catch(() => {
    started = false;
    showPlaying(false);
  });

  soundBtn.addEventListener('click', () => {
    if (!started) {
      bgm.play();
      started = true;
      showPlaying(true);
      return;
    }
    if (bgm.paused) {
      bgm.play();
      showPlaying(true);
    } else {
      bgm.pause();
      showPlaying(false);
    }
  });
</script>

</body>
</html>
